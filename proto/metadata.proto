syntax = "proto3";

package metadata;

option go_package = "github.com/cmpe541/file-metadata-manager/pkg/api";

// FileMetadata represents the metadata for a file
message FileMetadata {
  string file_id = 1;
  string owner = 2;
  int64 version = 3;
  string created_at = 4;
  string updated_at = 5;
  string last_modified_by = 6;
  map<string, string> attributes = 7;
}

// Lock status information
message LockInfo {
  string file_id = 1;
  string holder = 2;
  string acquired_at = 3;
  bool is_locked = 4;
}

// Request/Response messages
message CreateFileRequest {
  string file_id = 1;
  string owner = 2;
  map<string, string> attributes = 3;
}

message CreateFileResponse {
  FileMetadata metadata = 1;
  bool success = 2;
  string message = 3;
}

message GetFileRequest {
  string file_id = 1;
}

message GetFileResponse {
  FileMetadata metadata = 1;
  bool success = 2;
  string message = 3;
}

message UpdateFileRequest {
  string file_id = 1;
  string node_id = 2;
  map<string, string> attributes = 3;
}

message UpdateFileResponse {
  FileMetadata metadata = 1;
  bool success = 2;
  string message = 3;
  string lock_holder = 4;
}

message DeleteFileRequest {
  string file_id = 1;
  string node_id = 2;
}

message DeleteFileResponse {
  bool success = 1;
  string message = 2;
}

message ListFilesRequest {
  string prefix = 1;
}

message ListFilesResponse {
  repeated FileMetadata files = 1;
  bool success = 2;
  string message = 3;
}

message AcquireLockRequest {
  string file_id = 1;
  string node_id = 2;
}

message AcquireLockResponse {
  bool success = 1;
  string message = 2;
  LockInfo lock_info = 3;
}

message ReleaseLockRequest {
  string file_id = 1;
  string node_id = 2;
}

message ReleaseLockResponse {
  bool success = 1;
  string message = 2;
}

message GetLockStatusRequest {
  string file_id = 1;
}

message GetLockStatusResponse {
  LockInfo lock_info = 1;
  bool success = 2;
  string message = 3;
}

message GetNodeInfoRequest {}

message NodeInfo {
  string node_id = 1;
  string status = 2;
  int32 grpc_port = 3;
  int32 http_port = 4;
}

message GetNodeInfoResponse {
  NodeInfo node = 1;
  bool success = 2;
}

// The FileMetadataService provides operations for managing file metadata
service FileMetadataService {
  // File operations
  rpc CreateFile(CreateFileRequest) returns (CreateFileResponse);
  rpc GetFile(GetFileRequest) returns (GetFileResponse);
  rpc UpdateFile(UpdateFileRequest) returns (UpdateFileResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);

  // Lock operations
  rpc AcquireLock(AcquireLockRequest) returns (AcquireLockResponse);
  rpc ReleaseLock(ReleaseLockRequest) returns (ReleaseLockResponse);
  rpc GetLockStatus(GetLockStatusRequest) returns (GetLockStatusResponse);

  // Node info
  rpc GetNodeInfo(GetNodeInfoRequest) returns (GetNodeInfoResponse);
}
